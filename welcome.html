<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Welcome to SwiftAgent</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    /* Base */
    body {
      background-color: #f5f5f0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Responsive */
    @media only screen and (max-width: 480px) {
      .email-container { width: 100% !important; }
      .fluid { max-width: 100% !important; height: auto !important; }
      .stack-column { display: block !important; width: 100% !important; }
      .heading-text { font-size: 28px !important; line-height: 34px !important; }
      .hero-overlay-text { font-size: 11px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f0;">
  <!-- Preview text -->
  <div style="display: none; max-height: 0; overflow: hidden;">
    Welcome to SwiftAgent — you're one of our very first customers and we appreciate you.
    &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
  </div>

  <!-- Visually hidden preheader spacer -->
  <div style="display: none; max-height: 0px; overflow: hidden;">
    &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
  </div>

  <center style="width: 100%; background-color: #f5f5f0;">
    <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 420px; margin: 0 auto;" class="email-container">

      <!-- Logo -->
      <tr>
        <td style="padding: 40px 0 20px; text-align: center;">
          <img src="{{logoUrl}}" alt="SwiftAgent" width="48" height="48" style="display: inline-block; width: 48px; height: 48px;">
        </td>
      </tr>

      <!-- Heading -->
      <tr>
        <td style="padding: 0 30px 30px; text-align: center;">
          <h1 style="margin: 0; font-size: 34px; line-height: 42px; font-weight: 300; color: #c4a882; letter-spacing: -0.5px;" class="heading-text">
            Welcome to<br>
            <span style="font-weight: 800; background: url('{{heroImageUrl}}') center/cover no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">automated</span>
            <span style="font-weight: 300; background: url('{{heroImageUrl}}') center/cover no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">customer</span><br>
            <span style="font-weight: 800; background: url('{{heroImageUrl}}') center/cover no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">service</span><span style="font-weight: 300; color: #c4a882;">.</span>
          </h1>
        </td>
      </tr>

      <!-- Hero image (welcome.svg with built-in photo) -->
      <tr style="position: relative;">
        <td style="padding: 0 16px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
              <td>
                <img src="{{heroImageUrl}}" alt="Welcome" width="388" style="display: block; width: 100%; height: auto;" class="fluid">
              </td>
            </tr>
            <!-- Overlay message row -->
            <tr>
              <td style="padding: 20px 24px; position: absolute; top: 0; left: 0; right: 0;">
                <p style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; color: white; text-transform: uppercase; letter-spacing: 1.5px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;" class="hero-overlay-text">
                  You are one of our very first<br>
                  customers and we appreciate<br>
                  you
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <!-- CTA Button -->
      <tr>
        <td style="padding: 30px 30px 20px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
              <td style="border-radius: 10px; box-shadow: -3px 3px 0px 0px #000000; background-color: #ff6b4a; text-align: center;">
                <a href="{{dashboardUrl}}" target="_blank" style="display: block; padding: 16px 24px; font-size: 13px; font-weight: 700; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; letter-spacing: 2px; text-transform: uppercase;">
                  Head to your dashboard
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

    </table>

    <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
  </center>

</body>
</html>
