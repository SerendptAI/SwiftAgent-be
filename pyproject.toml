[project]
name = "SwiftAgent-be"
version = "0.1.0"
description = "Voice-first AI support platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "fastembed>=0.7.4,<1.0.0",
    "google-auth>=2.48.0,<3.0.0",
    "google-auth-oauthlib>=1.2.4,<2.0.0",
    "motor>=3.7.1,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "cloudinary>=1.40.0,<2.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "anthropic>=0.39.0,<1.0.0",
    "openai>=1.30.0,<2.0.0",
    "playwright>=1.40.0,<2.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "sendgrid>=6.11.0,<7.0.0",
    "redis>=7.4.0",
    "streamlit>=1.56.0",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "cryptography>=44.0.0",
    "pywebpush>=2.3.0",
    "python-magic>=0.4.27",
    "polar-sdk>=0.31.6",
    "langfuse>=2.0.0,<3.0.0",
    "playwright-stealth>=2.0.3",
    "langgraph>=0.0.26",
    "langchain-core>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-google-genai>=1.0.6",
    "langchain-openai>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mongomock-motor>=0.0.34",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
