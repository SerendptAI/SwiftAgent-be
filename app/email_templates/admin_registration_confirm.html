<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Confirm Approval - SwiftAgent</title>
    </head>
    <body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f8; margin: 0;">
        <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; text-align: center;">
            <h2 style="margin-top: 0;">Confirm Approval</h2>
            <p>Are you sure you want to approve the registration for <b>{{company_name}}</b> ({{company_email}})?</p>
            <form action="/api/v1/auth/registrations/approve/{{token}}" method="post">
                <button type="submit" style="padding: 12px 24px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px;">
                    Yes, Approve This Account
                </button>
            </form>
        </div>
    </body>
</html>
