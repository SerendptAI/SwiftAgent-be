<!doctype html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="format-detection"
      content="telephone=no,address=no,email=no,date=no,url=no"
    />
    <title>Confirm Approval - SwiftAgent</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:AllowPNG />
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

@font-face {
        font-family: "Greed Narrow";
        src: url("fonts/GreedNarrow-SemiBold.otf") format("opentype");
        font-style: normal;
        font-weight: 600;
      }

      :root {
        color-scheme: light;
        supported-color-schemes: light;
      }

      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        min-height: 100% !important;
      }
      table {
        border-collapse: collapse !important;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background-color: #f5f5f4;
        color: #111111;
        font-family: "DM Mono", "Courier New", Courier, monospace;
        overflow-x: hidden;
      }

      .email-container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #f5f5f4;
      }

      .display-font {
        font-family: "Greed Narrow", "Arial Narrow", Impact, sans-serif;
        font-stretch: condensed;
      }

      .logo-mark {
        display: block;
        width: 72px;
        height: 70px;
        margin: 0 auto;
      }

      .heading-text {
        margin: 0;
        color: #697454;
        background-color: #697454;
        background-image: url('images/text-bg.jpg');
        background-position: center center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: rgba(0, 0, 0, 0);
        font-size: 58px;
        line-height: 1.24;
        font-weight: 600;
        letter-spacing: -1.16px;
        text-align: center;
        vertical-align: middle;
      }

      .body-text {
        margin: 0;
        color: #111111;
        font-family: "DM Mono", "Courier New", Courier, monospace;
        font-size: 18px;
        line-height: 2;
        font-weight: 400;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
      }

      .company-name {
        color: #697454;
        font-weight: 500;
      }

      .cta-button {
        display: block;
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 8px;
        background-color: #f24d33;
        box-shadow: -4px 8px 0 #000000;
        color: #ffffff !important;
        cursor: pointer;
        font-family: "DM Mono", "Courier New", Courier, monospace;
        font-size: 18px;
        line-height: 54px;
        font-weight: 500;
        letter-spacing: 0;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
      }

      @media only screen and (max-width: 620px) {
        .email-container {
          width: 100% !important;
          max-width: 100% !important;
        }
        .logo-cell {
          padding-top: 72px !important;
          padding-bottom: 55px !important;
        }
        .heading-cell {
          padding: 0 58px 30px !important;
        }
        .heading-text {
          font-size: 52px !important;
          line-height: 1.24 !important;
          letter-spacing: -1.04px !important;
        }
        .copy-cell {
          padding: 0 58px 72px !important;
        }
        .button-cell {
          padding: 0 42px 94px !important;
        }
      }

      @media only screen and (max-width: 480px) {
        .logo-cell {
          padding-top: 52px !important;
          padding-bottom: 42px !important;
        }
        .logo-mark {
          width: 50px !important;
          height: 49px !important;
        }
        .heading-cell {
          padding: 0 22px 26px !important;
        }
        .heading-text {
          font-size: 35px !important;
          line-height: 1.18 !important;
          letter-spacing: -0.7px !important;
        }
        .copy-cell {
          padding: 0 28px 56px !important;
        }
        .body-text {
          font-size: 16px !important;
          line-height: 1.9 !important;
        }
        .button-cell {
          padding: 0 28px 94px !important;
        }
        .cta-button {
          font-size: 16px !important;
          line-height: 54px !important;
          box-shadow: -3px 6px 0 #000000 !important;
        }
      }

      @media only screen and (max-width: 375px) {
        .heading-cell {
          padding-left: 14px !important;
          padding-right: 14px !important;
        }
        .heading-text {
          font-size: 30px !important;
          line-height: 1.16 !important;
          letter-spacing: -0.6px !important;
        }
        .copy-cell,
        .button-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f5f4">
    <center
      role="article"
      aria-roledescription="email"
      lang="en"
      style="width: 100%; overflow-x: hidden; background-color: #f5f5f4"
    >
      <table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        align="center"
        width="100%"
        style="max-width: 600px; margin: 0 auto"
        class="email-container"
      >
        <tr>
          <td
            class="logo-cell"
            style="padding: 72px 0 55px; text-align: center"
          >
            <img
              src="images/favicon.png"
              width="72"
              height="70"
              alt="SwiftAgent"
              class="logo-mark"
            />
          </td>
        </tr>

        <tr>
          <td
            class="heading-cell"
            style="padding: 0 58px 30px; text-align: center"
          >
            <h1 class="display-font heading-text">Confirm approval</h1>
          </td>
        </tr>

        <tr>
          <td class="copy-cell" style="padding: 0 58px 72px">
            <p class="body-text">
              Approve the registration for
              <span class="company-name">Romeo Support</span>
              (hello@romeosupport.com)?
            </p>
          </td>
        </tr>

        <tr>
          <td class="button-cell" style="padding: 0 42px 94px">
            <form
              action="/api/v1/auth/registrations/approve/abc123token"
              method="post"
              style="margin: 0"
            >
              <button type="submit" class="cta-button">
                Yes, approve account
              </button>
            </form>
          </td>
        </tr>
      </table>
    </center>
  </body>
</html>
