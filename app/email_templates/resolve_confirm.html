<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Issue resolved?</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>

      :root {
        color-scheme: only light;
        supported-color-schemes: light;
      }

      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }

    body {
      background-color: #f5f5f4;
      color: #111111;
      font-family: Tahoma, Geneva, sans-serif;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .heading-svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .body-text {
      margin: 0;
      color: #111111;
      font-family: Tahoma, Geneva, sans-serif;
      font-size: 18px;
      line-height: 2;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
    }

    .copy-break {
      display: inline;
    }

    .choice-button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 7px;
      color: #ffffff;
      cursor: pointer;
      display: block;
      font-family: Tahoma, Geneva, sans-serif;
      font-size: 18px;
      line-height: 54px;
      font-weight: 500;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
    }

    .yes-button {
      background-color: #fb492b;
    }

    .no-button {
      background-color: #7d99ef;
    }

    .hero-frame {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 82px !important; padding-bottom: 76px !important; }
      .heading-cell { padding: 0 58px 62px !important; }
      .copy-cell { padding: 0 88px 72px !important; }
      .actions-cell { padding: 0 72px 92px !important; }
      .image-cell { padding: 0 58px 94px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 59px !important; padding-bottom: 58px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding: 0 28px 48px !important; }
      .copy-cell { padding: 0 34px 58px !important; }
      .body-text { font-size: 16px !important; line-height: 2 !important; }
      .actions-cell { padding: 0 28px 70px !important; }
      .choice-button { height: 54px !important; font-size: 16px !important; line-height: 54px !important; }
      .image-cell { padding: 0 34px 94px !important; }
    }

    @media only screen and (max-width: 375px) {
      .heading-cell { padding-left: 20px !important; padding-right: 20px !important; }
      .copy-cell { padding-left: 24px !important; padding-right: 24px !important; }
      .actions-cell { padding-left: 20px !important; padding-right: 20px !important; }
      .image-cell { padding-left: 24px !important; padding-right: 24px !important; padding-bottom: 94px !important; }
    }

    @media only screen and (max-width: 430px) {
      .copy-break { display: none !important; }
    }
  
            /* ── Force light mode ── */
            /* Prevent dark-mode inversion in Apple Mail, iOS Mail, Samsung Mail */
            @media (prefers-color-scheme: dark) {
                body,
                center,
                .email-container {
                    background-color: #f5f5f4 !important;
                    color: #111111 !important;
                }
                body * {
                    border-color: transparent !important;
                }
                /* Keep image colours untouched */
                img {
                    filter: none !important;
                }
                /* Preserve white-background cards / pills */
                .coupon-card {
                    background-color: #ffffff !important;
                }
                .preview-pill,
                .description-box {
                    background-color: #ededed !important;
                    color: #111111 !important;
                }
                /* Preserve button colours */
                .invite-button,
                .resolve-button,
                .cta-button,
                .copy-button,
                .choice-button,
                .yes-button,
                .no-button {
                    color: #ffffff !important;
                }
                .copy-button {
                    color: #111111 !important;
                }
                /* Preserve ticket pill */
                .button-shell {
                    background-color: #f3b832 !important;
                }
                .ticket-label,
                .ticket-number {
                    color: #ffffff !important;
                }
                /* Daily updates button */
                .date-button,
                .view-button {
                    color: #ffffff !important;
                }
            }
            /* Outlook dark mode (data-ogsc) */
            [data-ogsc] body,
            [data-ogsc] center,
            [data-ogsc] .email-container {
                background-color: #f5f5f4 !important;
                color: #111111 !important;
            }
            [data-ogsc] .coupon-card {
                background-color: #ffffff !important;
            }
            [data-ogsc] .preview-pill,
            [data-ogsc] .description-box {
                background-color: #ededed !important;
                color: #111111 !important;
            }
        </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4; color-scheme: only light;">
  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 82px 0 76px; text-align: center;">
          <img src="{{company_logo_url}}" width="72" height="70" alt="{{company_name}}" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 58px 62px; text-align: center;">
          <img
            class="heading-svg"
            src="{{base_url}}/images/headings/resolve_confirm_heading.png"
            width="477"
            height="125"
            alt="Has your issue been resolved?" style="max-width: 100%; width: 100%; height: auto;">
        </td>
      </tr>

      <tr>
        <td class="copy-cell" style="padding: 0 88px 72px;">
          <p class="body-text">
            Has your issue been addressed? We<br class="copy-break">
            will proceed if we do not hear back<br class="copy-break">
            from you.
          </p>
        </td>
      </tr>

      <tr>
        <td class="actions-cell" style="padding: 0 72px 92px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
              <td width="49%" style="padding: 0 10px 0 0;">
                <form action="{{base_url}}/api/v1/email/resolve/{{resolve_token}}/confirm" method="POST" style="margin: 0;">
                  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: separate; border-spacing: 0;">
                    <tr>
                      <td style="background-color: #030303; border-radius: 7px; padding-bottom: 7px; padding-left: 4px;">
                        <button type="submit" style="display: block; width: 100%; height: 54px; border: 0; border-radius: 7px; background-color: #fb492b; color: #ffffff; cursor: pointer; font-family: Tahoma, Geneva, sans-serif; font-size: 18px; line-height: 54px; font-weight: 500; text-align: center; text-transform: uppercase;">Yes</button>
                      </td>
                    </tr>
                  </table>
                </form>
              </td>
              <td width="2%"></td>
              <td width="49%" style="padding: 0 0 0 10px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: separate; border-spacing: 0;">
                  <tr>
                    <td style="background-color: #030303; border-radius: 7px; padding-bottom: 7px; padding-left: 4px;">
                      <a href="mailto:" style="display: block; width: 100%; height: 54px; border-radius: 7px; background-color: #7d99ef; color: #ffffff; font-family: Tahoma, Geneva, sans-serif; font-size: 18px; line-height: 54px; font-weight: 500; text-align: center; text-decoration: none; text-transform: uppercase;">No</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 94px;">
          <div class="hero-frame">
            <img src="{{base_url}}/images/otp.png" width="484" height="381" alt="Issue resolution" class="hero-image" style="max-width: 100%; width: 100%; height: auto;">
          </div>
        </td>
      </tr>
    </table>
    </center>
</body>
</html>
