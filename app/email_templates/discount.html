<!doctype html>
<html
    lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office"
>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta name="supported-color-schemes" content="light" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="x-apple-disable-message-reformatting" />
        <meta
            name="format-detection"
            content="telephone=no,address=no,email=no,date=no,url=no"
        />
        <title>Discount</title>
        <!--[if mso]>
            <noscript>
                <xml>
                    <o:OfficeDocumentSettings>
                        <o:AllowPNG />
                        <o:PixelsPerInch>96</o:PixelsPerInch>
                    </o:OfficeDocumentSettings>
                </xml>
            </noscript>
        <![endif]-->
        <style>

            :root {
                color-scheme: only light;
                supported-color-schemes: light;
            }

            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
            table,
            td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            img {
                -ms-interpolation-mode: bicubic;
                border: 0;
                height: auto;
                line-height: 100%;
                outline: none;
                text-decoration: none;
            }
            body {
                margin: 0;
                padding: 0;
                width: 100% !important;
                height: 100% !important;
            }
            table {
                border-collapse: collapse !important;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            a[x-apple-data-detectors] {
                color: inherit !important;
                text-decoration: none !important;
                font-size: inherit !important;
                font-family: inherit !important;
                font-weight: inherit !important;
                line-height: inherit !important;
            }

            body {
                background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4);
                color: #111111;
                font-family: Tahoma, Geneva, sans-serif;
                overflow-x: hidden;
            }

            .email-container {
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
                background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4);
            }

            .heading-svg {
                display: block;
                max-width: 324px;
                height: auto;
                margin: 0 auto;
            }

            .logo-mark {
                display: block;
                width: 72px;
                height: 70px;
                margin: 0 auto;
            }

            .description-box {
                display: block;
                background-color: #ededed;
                border-radius: 8px;
                padding: 18px 22px;
                color: #111111;
                font-family: Tahoma, Geneva, sans-serif;
                font-size: 16px;
                line-height: 1.75;
                font-weight: 400;
                letter-spacing: 0.04em;
                text-align: center;
                text-transform: uppercase;
            }

            .coupon-card {
                max-width: 325px;
                margin: 0 auto;
                background-color: #ffffff;
                border-radius: 14px;
                padding: 28px 32px 24px;
                text-align: center;
            }

            .barcode-image {
                display: block;
                max-width: 214px;
                height: auto;
                margin: 0 auto 18px;
            }

            .discount-code {
                margin: 0;
                color: #111111;
                font-family: Tahoma, Geneva, sans-serif;
                font-size: 28px;
                line-height: 1;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-align: center;
                text-transform: uppercase;
            }

            .copy-button {
                display: block;
                height: 54px;
                color: #111111 !important;
                background-color: #f3b832;
                border-radius: 8px;
                font-family: Tahoma, Geneva, sans-serif;
                font-size: 18px;
                line-height: 54px;
                font-weight: 500;
                letter-spacing: 0.05em;
                text-align: center;
                text-decoration: none;
                text-transform: uppercase;
            }

            .copy-icon {
                display: inline-block;
                vertical-align: middle;
                margin-right: 10px;
                margin-top: -3px;
            }

            @media only screen and (max-width: 620px) {
                .email-container {
                    width: 100% !important;
                    max-width: 100% !important;
                }
                .logo-cell {
                    padding-top: 78px !important;
                    padding-bottom: 70px !important;
                }
                .heading-cell {
                    padding: 0 34px 48px !important;
                }
                .description-cell {
                    padding: 0 42px 52px !important;
                }
                .coupon-cell {
                    padding: 0 42px 78px !important;
                }
                .cta-cell {
                    padding: 0 42px 94px !important;
                }
            }

            @media only screen and (max-width: 480px) {
                .logo-cell {
                    padding-top: 59px !important;
                    padding-bottom: 58px !important;
                }
                .logo-mark {
                    width: 50px !important;
                    height: 49px !important;
                }
                .heading-cell {
                    padding: 0 18px 40px !important;
                }
                .description-cell {
                    padding: 0 28px 44px !important;
                }
                .description-box {
                    font-size: 14px !important;
                    padding: 14px 18px !important;
                }
                .coupon-cell {
                    padding: 0 28px 66px !important;
                }
                .discount-code {
                    font-size: 22px !important;
                }
                .cta-cell {
                    padding: 0 32px 94px !important;
                }
                .copy-button {
                    font-size: 16px !important;
                }
            }

            @media only screen and (max-width: 375px) {
                .heading-cell {
                    padding-left: 12px !important;
                    padding-right: 12px !important;
                    padding-bottom: 34px !important;
                }
                .description-cell {
                    padding-left: 18px !important;
                    padding-right: 18px !important;
                    padding-bottom: 38px !important;
                }
                .coupon-cell {
                    padding-left: 18px !important;
                    padding-right: 18px !important;
                    padding-bottom: 57px !important;
                }
                .cta-cell {
                    padding-left: 26px !important;
                    padding-right: 26px !important;
                    padding-bottom: 94px !important;
                }
            }
        
            /* ── Force light mode ── */
            /* Prevent dark-mode inversion in Apple Mail, iOS Mail, Samsung Mail */
            @media (prefers-color-scheme: dark) {
                body,
                center,
                .email-container {
                    background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4) !important;
                    color: #111111 !important;
                }
                body * {
                    border-color: transparent !important;
                }
                /* Keep image colours untouched */
                img {
                    filter: none !important;
                }
                /* Preserve white-background cards / pills */
                .coupon-card {
                    background-color: #ffffff !important;
                }
                .preview-pill,
                .description-box {
                    background-color: #ededed !important;
                    color: #111111 !important;
                }
                /* Preserve button colours */
                .invite-button,
                .resolve-button,
                .cta-button,
                .copy-button,
                .choice-button,
                .yes-button,
                .no-button {
                    color: #ffffff !important;
                }
                .copy-button {
                    color: #111111 !important;
                }
                /* Preserve ticket pill */
                .button-shell {
                    background-color: #f3b832 !important;
                }
                .ticket-label,
                .ticket-number {
                    color: #ffffff !important;
                }
                /* Daily updates button */
                .date-button,
                .view-button {
                    color: #ffffff !important;
                }
            }
            /* Outlook dark mode (data-ogsc) */
            [data-ogsc] body,
            [data-ogsc] center,
            [data-ogsc] .email-container {
                background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4) !important;
                color: #111111 !important;
            }
            [data-ogsc] .coupon-card {
                background-color: #ffffff !important;
            }
            [data-ogsc] .preview-pill,
            [data-ogsc] .description-box {
                background-color: #ededed !important;
                color: #111111 !important;
            }
        
            /* ── Gmail dark mode fix (blend mode hack) ── */
            u + .body .gmail-blend-screen { background: #000000; mix-blend-mode: screen; }
            u + .body .gmail-blend-difference { background: #000000; mix-blend-mode: difference; }
        </style>
    </head>
    <body class="body" style="margin: 0; padding: 0; background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4); color-scheme: only light;">
        <div style="display: none; max-height: 0; overflow: hidden">
            You have a discount. &#847; &#847; &#847; &#847; &#847; &#847;
            &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
        </div>

        <center
            role="article"
            aria-roledescription="email"
            lang="en"
            style="width: 100%; overflow-x: hidden; background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4)"
        >
        <div style="background-color: #f5f5f4; background-image: linear-gradient(#f5f5f4, #f5f5f4);">
            <div class="gmail-blend-screen">
                <div class="gmail-blend-difference">
            <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

            <table
                role="presentation"
                cellspacing="0"
                cellpadding="0"
                border="0"
                align="center"
                width="100%"
                style="max-width: 600px; margin: 0 auto"
                class="email-container"
            >
                <tr>
                    <td
                        class="logo-cell"
                        style="padding: 85px 0 70px; text-align: center"
                    >
                        <img
                            src="{{base_url}}/images/logo.png"
                            width="72"
                            height="70"
                            alt="SwiftAgent"
                            class="logo-mark"
                        />
                    </td>
                </tr>

                <tr>
                    <td
                        class="heading-cell"
                        style="padding: 0 45px 48px; text-align: center"
                    >
                        <img
                            class="heading-svg"
                            src="{{base_url}}/images/headings/discount_heading.png"
                            width="324"
                            height="159"
                            alt="You have a discount" style="max-width: 100%; width: 100%; height: auto;">
                    </td>
                </tr>

                <tr>
                    <td class="description-cell" style="padding: 0 42px 52px">
                        <span class="description-box">As one of our valued early supporters, we&rsquo;re excited to offer you an exclusive discount. Enjoy your experience with us!</span>
                    </td>
                </tr>

                <tr>
                    <td class="coupon-cell" style="padding: 0 42px 94px">
                        <div class="coupon-card">
                            <img
                                src="{{base_url}}/images/discount_barcode.png"
                                width="214"
                                height="80"
                                alt="Discount barcode"
                                class="barcode-image" style="max-width: 100%; width: 100%; height: auto;">
                            <p class="discount-code">{{discount_code}}</p>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="cta-cell" style="padding: 0 46px 94px">
                        <a href="#" class="copy-button">
                            <img src="{{base_url}}/images/copy-icon.png" width="24" height="24" alt="Copy" class="copy-icon" />
                            COPY CODE
                        </a>
                    </td>
                </tr>

            </table>

            <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
                        </div>
            </div>
        </div>
    </center>
    </body>
</html>
