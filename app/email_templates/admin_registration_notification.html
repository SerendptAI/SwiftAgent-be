<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>New Registration Request</title>
    </head>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50;">New Registration Request</h2>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p><b>Company Name:</b> {{company_name}}</p>
            <p><b>Email:</b> <a href="mailto:{{company_email}}">{{company_email}}</a></p>
            <p><b>Customer Size:</b> {{customer_size}}</p>
            <p><b>Description:</b><br>{{company_description}}</p>
        </div>
        <a href="{{approval_url}}" style="display: inline-block; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Review & Approve</a>
        <p style="margin-top: 20px; font-size: 12px; color: #7f8c8d;">You will be asked to confirm this approval.</p>
    </body>
</html>
