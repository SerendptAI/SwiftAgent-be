<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Approve Company</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

@font-face {
      font-family: "Greed Narrow";
      src: url("{{base_url}}/email-fonts/GreedNarrow-SemiBold.otf") format("opentype");
      font-style: normal;
      font-weight: 600;
    }

    :root {
      color-scheme: light;
      supported-color-schemes: light;
    }

    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    body {
      background-color: #f5f5f4;
      color: #111111;
      font-family: "DM Mono", "Courier New", Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .heading-svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .body-text {
      margin: 0;
      color: #111111;
      font-family: "DM Mono", "Courier New", Courier, monospace;
      font-size: 18px;
      line-height: 2;
      font-weight: 400;
      letter-spacing: 0;
      text-align: left;
      text-transform: uppercase;
    }

    .details-list {
      margin: 14px 0 0;
      padding: 0;
      color: #111111;
      font-family: "DM Mono", "Courier New", Courier, monospace;
      font-size: 18px;
      line-height: 2;
      font-weight: 400;
      letter-spacing: 0;
      text-align: left;
      text-transform: uppercase;
    }

    .detail-item {
      display: block;
      margin: 0;
      padding: 0;
    }

    .invite-button {
      display: block;
      width: 100%;
      height: 54px;
      border-radius: 8px;
      background-color: #f24d33;
      box-shadow: -4px 8px 0 #000000;
      color: #ffffff !important;
      font-family: "DM Mono", "Courier New", Courier, monospace;
      font-size: 18px;
      line-height: 54px;
      font-weight: 500;
      letter-spacing: 0;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }

    .hero-frame {
      width: 100%;
      max-width: 474px;
      margin: 0 auto;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 72px !important; padding-bottom: 16px !important; }
      .heading-cell { padding: 0 70px 26px !important; }
      .copy-cell { padding: 0 101px 34px !important; }
      .button-cell { padding: 0 42px 48px !important; }
      .image-cell { padding: 0 58px 51px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 48px !important; padding-bottom: 16px !important; }
      .logo-mark { width: 58px !important; height: 57px !important; }
      .heading-cell { padding: 0 48px 26px !important; }
      .copy-cell { padding: 0 48px 34px !important; }
      .body-text,
      .details-list { font-size: 16px !important; line-height: 1.95 !important; }
      .button-cell { padding: 0 32px 48px !important; }
      .invite-button { height: 54px !important; border-radius: 8px !important; font-size: 16px !important; line-height: 54px !important; font-weight: 500 !important; }
      .image-cell { padding: 0 42px 51px !important; }
    }

    @media only screen and (max-width: 375px) {
      .logo-cell { padding-top: 42px !important; padding-bottom: 16px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding-left: 32px !important; padding-right: 32px !important; }
      .copy-cell { padding-left: 32px !important; padding-right: 32px !important; padding-bottom: 34px !important; }
      .button-cell { padding-left: 24px !important; padding-right: 24px !important; padding-bottom: 48px !important; }
      .image-cell { padding-left: 28px !important; padding-right: 28px !important; padding-bottom: 51px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4;">
  <div style="display: none; max-height: 0; overflow: hidden;">
    There is a new company on the waitlist. Review and approve their registration.
    &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
  </div>

  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 72px 0 16px; text-align: center;">
          <img src="{{base_url}}/email-images/favicon.png" width="72" height="70" alt="SwiftAgent" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 70px 26px; text-align: center;">
          <img
            class="heading-svg"
            src="{{base_url}}/email-images/headings/approve_company_heading.png"
            width="327"
            height="136"
            alt="There's a new company!"
          />
        </td>
      </tr>

      <tr>
        <td class="copy-cell" style="padding: 0 101px 34px;">
          <p class="body-text">
            There's a new company on the waitlist, ensure you verify their legitimacy
          </p>
          <div class="details-list">
            <span class="detail-item">{{company_name}}</span>
            <span class="detail-item">{{company_email}}</span>
            <span class="detail-item">{{company_description}}</span>
            <span class="detail-item">{{customer_size}}</span>
          </div>
        </td>
      </tr>

      <tr>
        <td class="button-cell" style="padding: 0 42px 48px;">
          <a href="{{approval_url}}" target="_blank" class="invite-button">Approve</a>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 51px;">
          <div class="hero-frame">
            <img src="{{base_url}}/email-images/approve-company.png" width="474" height="373" alt="New kids on the block" class="hero-image">
          </div>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
