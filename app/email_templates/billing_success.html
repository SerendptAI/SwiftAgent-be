<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Billing successful</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    body {
      background-color: #f5f5f4;
      color: #4f4f51;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .display-font {
      font-family: 'Greed Narrow-TRIAL', 'Arial Narrow', Impact, sans-serif;
      font-stretch: condensed;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .heading-text {
      margin: 0;
      color: #697454;
      background-image: url('images/text-bg.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: rgba(0,0,0,0);
      font-size: 58px;
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: -1.16px;
      text-align: center;
      vertical-align: middle;
    }

    .body-text {
      margin: 0;
      color: #4f4f51;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1.95;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .button-shell {
      width: 100%;
      height: 58px;
      background-color: #2149df;
      border-radius: 10px;
    }

    .receipt-button,
    .download-button {
      display: block;
      color: #ffffff !important;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      line-height: 1;
      font-weight: 400;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .receipt-button {
      margin: 0;
      padding: 0;
      font-size: 18px;
      letter-spacing: 4px;
      text-align: left;
    }

    .download-button {
      margin: 0;
      height: 38px;
      padding: 0;
      background-color: #096ddf;
      border-radius: 13px;
      font-size: 16px;
      letter-spacing: 2px;
      line-height: 38px;
      text-align: center;
    }

    .hero-frame {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 82px !important; padding-bottom: 48px !important; }
      .heading-cell { padding: 0 42px 64px !important; }
      .heading-text { font-size: 52px !important; line-height: 1.24 !important; letter-spacing: -1.04px !important; }
      .details-cell { padding: 0 120px 116px !important; }
      .actions-cell { padding: 0 79px 52px !important; }
      .receipt-label-cell { padding-right: 30px !important; }
      .image-cell { padding: 0 58px 94px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 52px !important; padding-bottom: 48px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding: 0 20px 40px !important; }
      .heading-text { font-size: 36px !important; line-height: 1.2 !important; letter-spacing: -0.72px !important; }
      .details-cell { padding: 0 58px 84px !important; }
      .body-text { font-size: 16px !important; line-height: 1.95 !important; }
      .actions-cell { padding: 0 40px 38px !important; }
      .receipt-label-cell { padding-right: 20px !important; }
      .receipt-button { margin: 0 !important; padding: 0 !important; font-size: 15px !important; letter-spacing: 1.6px !important; }
      .download-button { margin: 0 !important; height: 38px !important; padding: 0 !important; border-radius: 13px !important; font-size: 14px !important; letter-spacing: 1.5px !important; line-height: 38px !important; }
      .image-cell { padding: 0 34px 94px !important; }
    }

    @media only screen and (max-width: 375px) {
      .logo-cell { padding-top: 44px !important; padding-bottom: 48px !important; }
      .heading-cell { padding-left: 14px !important; padding-right: 14px !important; padding-bottom: 34px !important; }
      .heading-text { font-size: 31px !important; line-height: 1.18 !important; letter-spacing: -0.62px !important; }
      .details-cell { padding-left: 34px !important; padding-right: 34px !important; padding-bottom: 68px !important; }
      .actions-cell { padding-left: 28px !important; padding-right: 28px !important; padding-bottom: 28px !important; }
      .receipt-label-cell { padding-right: 14px !important; }
      .receipt-button { font-size: 14px !important; letter-spacing: 1.2px !important; }
      .download-button { font-size: 14px !important; letter-spacing: 1px !important; }
      .image-cell { padding-left: 24px !important; padding-right: 24px !important; padding-bottom: 94px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4;">
  <div style="display: none; max-height: 0; overflow: hidden;">
    Congratulations. Your billing payment was successful.
    &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
  </div>

  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 82px 0 48px; text-align: center;">
          <img src="images/logo.png" width="72" height="70" alt="SwiftAgent" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 42px 64px; text-align: center;">
          <h1 class="display-font heading-text">Congratulations!</h1>
        </td>
      </tr>

      <tr>
        <td class="details-cell" style="padding: 0 120px 116px;">
          <p class="body-text">Duration: {{duration}}</p>
          <p class="body-text">Amount: {{amount}}</p>
          <p class="body-text">Plan: {{plan_name}}</p>
          <p class="body-text">Payment status: Successful</p>
        </td>
      </tr>

      <tr>
        <td class="actions-cell" style="padding: 0 79px 52px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" height="58" class="button-shell">
            <tr>
              <td width="54%" align="left" class="receipt-label-cell" style="padding: 10px 30px 10px 25px; text-align: left; vertical-align: middle;">
                <a href="{{receiptUrl}}" target="_blank" class="receipt-button">Download receipt</a>
              </td>
              <td width="46%" align="right" style="padding: 10px 10px 10px 0; text-align: right; vertical-align: middle;">
                <a href="{{downloadUrl}}" target="_blank" class="download-button">Download</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 94px;">
          <div class="hero-frame">
            <img src="images/billing-success.png" width="484" height="381" alt="Billing successful" class="hero-image">
          </div>
        </td>
      </tr>
    </table>

    <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
  </center>
</body>
</html>
