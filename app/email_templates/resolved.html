<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket Resolved</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
        }
        .check {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 12px; color: #10b981; }
        .subject { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
        .note { color: #64748b; font-size: 13px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>{{message}}</h1>
        <p class="subject">Ticket #{{ticket_id}} — {{ticket_subject}}</p>
        <p class="note">Thank you for your feedback.</p>
    </div>
</body>
</html>
