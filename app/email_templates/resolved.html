<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Ticket closed</title>
  <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap");

      :root {
        color-scheme: light;
        supported-color-schemes: light;
      }

      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: #f5f5f4;
      color: #111111;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .display-font {
      font-family: 'Greed Narrow-TRIAL', 'Arial Narrow', Impact, sans-serif;
      font-stretch: condensed;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .heading-text {
      margin: 0;
      color: #697454;
      background-image: url('images/text-bg-2.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: rgba(0,0,0,0);
      font-size: 58px;
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: -2.32px;
      text-align: center;
      vertical-align: middle;
    }

    .body-text {
      margin: 0;
      color: #111111;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 2;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
    }

    .hero-frame {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 82px !important; padding-bottom: 55px !important; }
      .heading-cell { padding: 0 58px 122px !important; }
      .heading-text { font-size: 52px !important; line-height: 1.24 !important; letter-spacing: -2.08px !important; }
      .image-cell { padding: 0 58px 94px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 59px !important; padding-bottom: 55px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding: 0 28px 72px !important; }
      .heading-text { font-size: 38px !important; line-height: 1.24 !important; letter-spacing: -1.52px !important; }
      .image-cell { padding: 0 34px 94px !important; }
    }

    @media only screen and (max-width: 375px) {
      .heading-cell { padding-left: 20px !important; padding-right: 20px !important; padding-bottom: 72px !important; }
      .heading-text { font-size: 33px !important; letter-spacing: -1.32px !important; }
      .image-cell { padding-left: 24px !important; padding-right: 24px !important; padding-bottom: 94px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4;">
  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 82px 0 55px; text-align: center;">
          <img src="images/logo 2.png" width="72" height="71" alt="{{company_name}}" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 58px 122px; text-align: center;">
          <h1 class="display-font heading-text">
            Your ticket has been closed
          </h1>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 94px;">
          <div class="hero-frame">
            <img src="images/ticket-closed.png" width="484" height="381" alt="Ticket closed" class="hero-image">
          </div>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
