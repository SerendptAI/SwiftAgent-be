<!doctype html>
<html
    lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office"
>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta name="supported-color-schemes" content="light" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="x-apple-disable-message-reformatting" />
        <meta
            name="format-detection"
            content="telephone=no,address=no,email=no,date=no,url=no"
        />
        <title>Response</title>
        <!--[if mso]>
            <noscript>
                <xml>
                    <o:OfficeDocumentSettings>
                        <o:AllowPNG />
                        <o:PixelsPerInch>96</o:PixelsPerInch>
                    </o:OfficeDocumentSettings>
                </xml>
            </noscript>
        <![endif]-->
        <style>
            @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

@font-face {
                font-family: "Greed Narrow";
                src: url("fonts/GreedNarrow-SemiBold.otf")
                    format("opentype");
                font-style: normal;
                font-weight: 600;
            }

            :root {
                color-scheme: only light;
                supported-color-schemes: light;
            }

            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
            table,
            td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            img {
                -ms-interpolation-mode: bicubic;
                border: 0;
                height: auto;
                line-height: 100%;
                outline: none;
                text-decoration: none;
            }
            body {
                margin: 0;
                padding: 0;
                width: 100% !important;
                height: 100% !important;
            }
            table {
                border-collapse: collapse !important;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            a[x-apple-data-detectors] {
                color: inherit !important;
                text-decoration: none !important;
                font-size: inherit !important;
                font-family: inherit !important;
                font-weight: inherit !important;
                line-height: inherit !important;
            }

            body {
                background-color: #f5f5f4;
                color: #111111;
                font-family: "DM Mono", "Courier New", Courier, monospace;
                overflow-x: hidden;
            }

            .email-container {
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
                background-color: #f5f5f4;
            }

            .heading-svg {
                display: block;
                max-width: 100%;
                height: auto;
                margin: 0 auto;
            }

            .profile-image {
                display: block;
                width: 46px;
                height: 46px;
                border-radius: 50%;
            }

            .agent-name {
                margin: 0;
                color: #111111;
                font-family: "DM Mono", "Courier New", Courier, monospace;
                font-size: 18px;
                line-height: 1.45;
                font-weight: 500;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            .agent-role {
                margin: 0;
                color: #111111;
                font-family: "DM Mono", "Courier New", Courier, monospace;
                font-size: 18px;
                line-height: 1.45;
                font-weight: 400;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            .love-icon {
                display: block;
                width: 32px;
                height: 31px;
            }

            .message-text {
                margin: 0;
                color: #111111;
                font-family: "DM Mono", "Courier New", Courier, monospace;
                font-size: 18px;
                line-height: 2.02;
                font-weight: 400;
                letter-spacing: 0;
                text-align: left;
                text-transform: uppercase;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .resolve-button {
                display: block;
                width: 100%;
                height: 54px;
                border-radius: 8px;
                background-color: #f24d33;
                box-shadow: -4px 8px 0 #000000;
                color: #ffffff !important;
                font-family: "DM Mono", "Courier New", Courier, monospace;
                font-size: 18px;
                line-height: 54px;
                font-weight: 500;
                letter-spacing: 0;
                text-align: center;
                text-decoration: none;
                text-transform: uppercase;
            }

            @media only screen and (max-width: 620px) {
                .email-container {
                    width: 100% !important;
                    max-width: 100% !important;
                }
                .agent-cell {
                    padding: 88px 85px 86px !important;
                }
                .heading-cell {
                    padding: 0 85px 40px !important;
                }
                .message-cell {
                    padding: 0 85px 112px !important;
                }
                .button-cell {
                    padding: 0 42px 94px !important;
                }
            }

            @media only screen and (max-width: 480px) {
                .agent-cell {
                    padding: 62px 42px 64px !important;
                }
                .profile-image {
                    width: 40px !important;
                    height: 40px !important;
                }
                .agent-name,
                .agent-role {
                    font-size: 16px !important;
                    line-height: 1.45 !important;
                }
                .love-icon {
                    width: 30px !important;
                    height: 29px !important;
                }
                .heading-cell {
                    padding: 0 42px 30px !important;
                }
                .message-cell {
                    padding: 0 42px 94px !important;
                }
                .message-text {
                    font-size: 16px !important;
                    line-height: 2 !important;
                }
                .button-cell {
                    padding: 0 28px 94px !important;
                }
                .resolve-button {
                    height: 54px !important;
                    border-radius: 8px !important;
                    font-size: 16px !important;
                    line-height: 54px !important;
                    font-weight: 500 !important;
                }
            }

            @media only screen and (max-width: 375px) {
                .agent-cell {
                    padding-left: 28px !important;
                    padding-right: 28px !important;
                }
                .heading-cell {
                    padding-left: 28px !important;
                    padding-right: 28px !important;
                }
                .message-cell {
                    padding-left: 28px !important;
                    padding-right: 28px !important;
                }
                .button-cell {
                    padding-left: 24px !important;
                    padding-right: 24px !important;
                }
                .agent-name,
                .agent-role,
                .message-text {
                    font-size: 16px !important;
                }
            }
        
            /* ── Force light mode ── */
            /* Prevent dark-mode inversion in Apple Mail, iOS Mail, Samsung Mail */
            @media (prefers-color-scheme: dark) {
                body,
                center,
                .email-container {
                    background-color: #f5f5f4 !important;
                    color: #111111 !important;
                }
                body * {
                    border-color: transparent !important;
                }
                /* Keep image colours untouched */
                img {
                    filter: none !important;
                }
                /* Preserve white-background cards / pills */
                .coupon-card {
                    background-color: #ffffff !important;
                }
                .preview-pill,
                .description-box {
                    background-color: #ededed !important;
                    color: #111111 !important;
                }
                /* Preserve button colours */
                .invite-button,
                .resolve-button,
                .cta-button,
                .copy-button,
                .choice-button,
                .yes-button,
                .no-button {
                    color: #ffffff !important;
                }
                .copy-button {
                    color: #111111 !important;
                }
                /* Preserve ticket pill */
                .button-shell {
                    background-color: #f3b832 !important;
                }
                .ticket-label,
                .ticket-number {
                    color: #ffffff !important;
                }
                /* Daily updates button */
                .date-button,
                .view-button {
                    color: #ffffff !important;
                }
            }
            /* Outlook dark mode (data-ogsc) */
            [data-ogsc] body,
            [data-ogsc] center,
            [data-ogsc] .email-container {
                background-color: #f5f5f4 !important;
                color: #111111 !important;
            }
            [data-ogsc] .coupon-card {
                background-color: #ffffff !important;
            }
            [data-ogsc] .preview-pill,
            [data-ogsc] .description-box {
                background-color: #ededed !important;
                color: #111111 !important;
            }
        </style>
    </head>
    <body style="margin: 0; padding: 0; background-color: #f5f5f4 color-scheme: only light;">
        <div style="display: none; max-height: 0; overflow: hidden">
            {{agent_name}} from {{company_name}} Support replied. &#847; &#847; &#847; &#847;
            &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
            &#847; &#847;
        </div>

        <center
            role="article"
            aria-roledescription="email"
            lang="en"
            style="width: 100%; overflow-x: hidden; background-color: #f5f5f4"
        >
            <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

            <table
                role="presentation"
                cellspacing="0"
                cellpadding="0"
                border="0"
                align="center"
                width="100%"
                style="max-width: 600px; margin: 0 auto"
                class="email-container"
            >
                <tr>
                    <td class="agent-cell" style="padding: 88px 85px 86px">
                        <table
                            role="presentation"
                            cellspacing="0"
                            cellpadding="0"
                            border="0"
                        >
                            <tr>
                                <td
                                    rowspan="2"
                                    style="padding: 0 18px 0 0; vertical-align: top;"
                                >
                                    <img
                                        src="{{agent_image_url}}"
                                        width="46"
                                        height="46"
                                        alt="{{agent_name}}"
                                        class="profile-image"
                                    />
                                </td>
                                <td style="padding: 0; vertical-align: middle; white-space: nowrap;">
                                    <p class="agent-name" style="margin: 0; display: inline;">{{agent_name}}</p><img src="{{company_logo_url}}" width="24" height="24" alt="{{company_name}}" style="display: inline-block; vertical-align: middle; margin-left: 12px;">
                                </td>
                            </tr>
                            <tr>
                                <td style="padding: 0; vertical-align: middle;">
                                    <p class="agent-role" style="margin: 0;">({{company_name}} Support)</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td
                        class="heading-cell"
                        style="padding: 0 85px 40px; text-align: center"
                    >
                        <img
                            class="heading-svg"
                            src="{{base_url}}/images/headings/response_heading.png"
                            width="233"
                            height="57"
                            alt="Hey there"
                        />
                    </td>
                </tr>

                <tr>
                    <td class="message-cell" style="padding: 0 85px 40px">
                        <p class="message-text">{{message}}</p>
                    </td>
                </tr>

                <tr>
                    <td class="button-cell" style="padding: 0 42px 94px">
                        <a href="{{resolve_url}}" class="resolve-button">Mark as resolved?</a>
                    </td>
                </tr>
            </table>

            <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
        </center>
    </body>
</html>
