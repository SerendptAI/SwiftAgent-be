      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

@font-face {

      :root {

    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }

    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    body {
      background-color: #f5f5f4;
      color: #111111;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .heading-svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .body-text {
      margin: 0;
      color: #111111;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 2;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
    }

    .copy-break {
      display: inline;
    }

    .code-box {
      width: 15%;
      height: 80px;
      border: 1px solid #111111;
      color: #030303;
      font-family: 'Greed Narrow', 'Arial Narrow', Impact, sans-serif;
      font-size: 44px;
      line-height: 80px;
      font-weight: 600;
      letter-spacing: -0.88px;
      text-align: center;
      vertical-align: middle;
    }

    .code-gap {
      width: 2%;
      font-size: 0;
      line-height: 0;
    }

    .otp-code {
      width: 100%;
    }

    .hero-frame {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {

<body style="margin: 0; padding: 0; background-color: #f5f5f4;">

  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 82px 0 80px; text-align: center;">
          <img src="images/favicon.png" width="72" height="70" alt="SwiftAgent" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 58px 32px; text-align: center;">
          <img
            class="heading-svg"
            src="images/headings/otp_email_heading.png"
            width="381"
            height="58"
            alt="Here's your OTP"
          />
        </td>
      </tr>

      <tr>
        <td class="copy-cell" style="padding: 0 90px 62px;">
          <p class="body-text">
            Here is your login verification code<br class="copy-break">
            (OTP). It expires in 10 minutes.<br class="copy-break">
            If you did not request this,<br class="copy-break">
            please disregard this message.
          </p>
        </td>
      </tr>

      <tr>
        <td class="code-cell" style="padding: 0 49px 88px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" class="otp-code">
            <tr>
              <td class="code-box">4</td>
              <td class="code-gap">&nbsp;</td>
              <td class="code-box">8</td>
              <td class="code-gap">&nbsp;</td>
              <td class="code-box">2</td>
              <td class="code-gap">&nbsp;</td>
              <td class="code-box">9</td>
              <td class="code-gap">&nbsp;</td>
              <td class="code-box">1</td>
              <td class="code-gap">&nbsp;</td>
              <td class="code-box">7</td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 94px;">
          <div class="hero-frame">
            <img src="images/otp.png" width="484" height="381" alt="OTP verification" class="hero-image">
          </div>
        </td>
      </tr>
    </table>

    <!--[if mso | IE]>
    </td>
