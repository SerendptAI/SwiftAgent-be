<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Welcome to SwiftAgent</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    body {
      background-color: #f5f5f4;
      color: #c9c3c7;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .display-font {
      font-family: 'Greed Narrow-TRIAL', 'Arial Narrow', Impact, sans-serif;
      font-stretch: condensed;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .heading-text {
      margin: 0;
      color: #c9c3c7;
      font-size: 58px;
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: -1.16px;
      text-align: center;
      vertical-align: middle;
    }

    .heading-fill {
      color: #65724a;
      background-image: url('images/welcome.jpg');
      background-position: center 58%;
      background-size: cover;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: rgba(0,0,0,0);
    }

    .hero-frame {
      position: relative;
      width: 100%;
      height: 423px;
      overflow: hidden;
      background-color: #d8d3d6;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 423px;
      object-fit: cover;
      object-position: center center;
    }

    .hero-copy {
      position: absolute;
      left: 39px;
      top: 48px;
      margin: 0;
      color: #ffffff;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
      text-align: left;
      text-transform: uppercase;
    }

    .notch {
      position: absolute;
      z-index: 2;
      width: 92px;
      height: 92px;
      background-color: #f5f5f4;
    }

    .notch-top {
      top: 0;
      right: 52px;
    }

    .notch-left {
      bottom: 75px;
      left: 0;
    }

    .notch-right {
      right: 0;
      bottom: 0;
    }

    .cta-button {
      display: block;
      padding: 22px 24px 20px;
      color: #ffffff !important;
      background-color: #fb492b;
      border-radius: 7px;
      box-shadow: -4px 7px 0 #030303;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 78px !important; padding-bottom: 70px !important; }
      .heading-cell { padding: 0 34px 58px !important; }
      .heading-text { font-size: 52px !important; line-height: 1.24 !important; letter-spacing: -1.04px !important; }
      .hero-cell { padding: 0 28px !important; }
      .hero-frame, .hero-image { height: 390px !important; }
      .cta-cell { padding: 54px 42px 112px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 59px !important; padding-bottom: 70px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding: 0 20px 45px !important; }
      .heading-text { font-size: 38px !important; line-height: 1.24 !important; letter-spacing: -0.76px !important; }
      .hero-cell { padding: 0 22px !important; }
      .hero-frame, .hero-image { height: 296px !important; }
      .hero-copy { left: 28px !important; top: 34px !important; font-size: 16px !important; line-height: 1 !important; letter-spacing: 0 !important; }
      .notch { width: 64px !important; height: 64px !important; }
      .notch-top { right: 36px !important; }
      .notch-left { bottom: 52px !important; }
      .cta-cell { padding: 41px 32px 88px !important; }
      .cta-button { padding: 16px 18px 15px !important; font-size: 16px !important; letter-spacing: 0 !important; box-shadow: -3px 5px 0 #030303 !important; }
    }

    @media only screen and (max-width: 375px) {
      .heading-cell { padding-left: 14px !important; padding-right: 14px !important; }
      .heading-text { font-size: 33px !important; letter-spacing: -0.66px !important; }
      .hero-cell { padding-left: 18px !important; padding-right: 18px !important; }
      .hero-frame, .hero-image { height: 270px !important; }
      .hero-copy { left: 24px !important; top: 30px !important; font-size: 16px !important; letter-spacing: 0 !important; }
      .notch { width: 58px !important; height: 58px !important; }
      .notch-top { right: 30px !important; }
      .notch-left { bottom: 46px !important; }
      .cta-cell { padding-left: 26px !important; padding-right: 26px !important; }
      .cta-button { font-size: 16px !important; letter-spacing: 0 !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4;">
  <div style="display: none; max-height: 0; overflow: hidden;">
    Welcome to automated customer service. You are one of our very first customers and we appreciate you.
    &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
  </div>

  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 85px 0 70px; text-align: center;">
          <img src="images/logo.png" width="72" height="70" alt="SwiftAgent" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 45px 63px; text-align: center;">
          <h1 class="display-font heading-text">
            Welcome to <span class="heading-fill">automated customer</span> <span class="heading-fill">service.</span>
          </h1>
        </td>
      </tr>

      <tr>
        <td class="hero-cell" style="padding: 0 31px;">
          <div class="hero-frame">
            <img src="images/welcome.jpg" width="538" height="423" alt="SwiftAgent customer service" class="hero-image">
            <p class="hero-copy">
              You are one of our very first<br>
              customers and we appreciate<br>
              you
            </p>
            <div class="notch notch-top"></div>
            <div class="notch notch-left"></div>
            <div class="notch notch-right"></div>
          </div>
        </td>
      </tr>

      <tr>
        <td class="cta-cell" style="padding: 58px 46px 126px;">
          <a href="{{dashboardUrl}}" target="_blank" class="cta-button">
            Head to your dashboard
          </a>
        </td>
      </tr>
    </table>

    <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
  </center>
</body>
</html>
