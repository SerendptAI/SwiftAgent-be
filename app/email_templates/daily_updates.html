<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Daily updates</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
      @font-face {
        font-family: "DM Mono";
        src: url("{{base_url}}/email-assets/fonts/DMMono-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
      }

      @font-face {
        font-family: "DM Mono";
        src: url("{{base_url}}/email-assets/fonts/DMMono-Medium.ttf") format("truetype");
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: "Greed Narrow";
        src: url("{{base_url}}/email-assets/fonts/GreedNarrow-SemiBold.otf") format("opentype");
        font-style: normal;
        font-weight: 600;
      }

      :root {
        color-scheme: light;
        supported-color-schemes: light;
      }

      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    table { border-collapse: collapse !important; }
    *, *::before, *::after { box-sizing: border-box; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    body {
      background-color: #f5f5f4;
      color: #4f4f51;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    .email-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #f5f5f4;
    }

    .display-font {
      font-family: 'Greed Narrow', 'Arial Narrow', Impact, sans-serif;
      font-stretch: condensed;
    }

    .logo-mark {
      display: block;
      width: 72px;
      height: 70px;
      margin: 0 auto;
    }

    .heading-text {
      margin: 0;
      color: #697454;
      background-color: #697454;
      background-image: url('{{base_url}}/email-assets/text-bg.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: rgba(0,0,0,0);
      font-size: 58px;
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: -1.16px;
      text-align: center;
      vertical-align: middle;
    }

    .body-text {
      margin: 0;
      color: #4f4f51;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1.95;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .button-shell {
      width: 100%;
      height: 58px;
      background-color: #5b2fd0;
      border-radius: 10px;
    }

    .date-button,
    .view-button {
      display: block;
      color: #ffffff !important;
      font-family: 'DM Mono', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 4px;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .date-button {
      margin: 0;
      padding: 0;
      text-align: left;
    }

    .view-button {
      margin: 0;
      height: 38px;
      padding: 0;
      background-color: #7644e9;
      border-radius: 13px;
      line-height: 38px;
      text-align: center;
    }

    .hero-frame {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .logo-cell { padding-top: 82px !important; padding-bottom: 48px !important; }
      .heading-cell { padding: 0 42px 64px !important; }
      .heading-text { font-size: 52px !important; line-height: 1.24 !important; letter-spacing: -1.04px !important; }
      .details-cell { padding: 0 120px 96px !important; }
      .actions-cell { padding: 0 79px 52px !important; }
      .image-cell { padding: 0 58px 94px !important; }
    }

    @media only screen and (max-width: 480px) {
      .logo-cell { padding-top: 59px !important; padding-bottom: 48px !important; }
      .logo-mark { width: 50px !important; height: 49px !important; }
      .heading-cell { padding: 0 24px 64px !important; }
      .heading-text { font-size: 38px !important; line-height: 1.24 !important; letter-spacing: -0.76px !important; }
      .details-cell { padding: 0 58px 88px !important; }
      .body-text { font-size: 16px !important; line-height: 1.95 !important; }
      .actions-cell { padding: 0 40px 52px !important; }
      .date-button, .view-button { font-size: 16px !important; letter-spacing: 2px !important; }
      .date-button { margin: 0 !important; padding: 0 !important; }
      .view-button { margin: 0 !important; height: 38px !important; padding: 0 !important; border-radius: 13px !important; line-height: 38px !important; }
      .image-cell { padding: 0 34px 94px !important; }
    }

    @media only screen and (max-width: 375px) {
      .heading-cell { padding-left: 16px !important; padding-right: 16px !important; }
      .heading-text { font-size: 33px !important; letter-spacing: -0.66px !important; }
      .details-cell { padding-left: 34px !important; padding-right: 34px !important; padding-bottom: 76px !important; }
      .actions-cell { padding-left: 28px !important; padding-right: 28px !important; }
      .date-button, .view-button { font-size: 16px !important; letter-spacing: 1.5px !important; }
      .image-cell { padding-left: 24px !important; padding-right: 24px !important; padding-bottom: 94px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f4;">
  <div style="display: none; max-height: 0; overflow: hidden;">
    Your daily updates are ready.
    &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
  </div>

  <center role="article" aria-roledescription="email" lang="en" style="width: 100%; overflow-x: hidden; background-color: #f5f5f4;">
    <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;" class="email-container">
      <tr>
        <td class="logo-cell" style="padding: 82px 0 48px; text-align: center;">
          <img src="{{base_url}}/email-assets/logo.png" width="72" height="70" alt="SwiftAgent" class="logo-mark">
        </td>
      </tr>

      <tr>
        <td class="heading-cell" style="padding: 0 42px 64px; text-align: center;">
          <h1 class="display-font heading-text">You've got</h1>
        </td>
      </tr>

      <tr>
        <td class="details-cell" style="padding: 0 120px 96px;">
          <p class="body-text">Pending Messages: {{pending_messages}}</p>
          <p class="body-text">Follow-up emails: {{follow_up_emails}}</p>
          <p class="body-text">Enquiries: {{enquiries}}</p>
          <p class="body-text">Payment status: Successful</p>
        </td>
      </tr>

      <tr>
        <td class="actions-cell" style="padding: 0 79px 52px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" height="58" class="button-shell">
            <tr>
              <td width="60%" align="left" style="padding: 10px 0 10px 25px; text-align: left; vertical-align: middle;">
                <span class="date-button">Date: {{date}}</span>
              </td>
              <td width="40%" align="right" style="padding: 10px 10px 10px 0; text-align: right; vertical-align: middle;">
                <a href="{{updatesUrl}}" target="_blank" class="view-button">View</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="image-cell" style="padding: 0 58px 94px;">
          <div class="hero-frame">
            <img src="{{base_url}}/email-assets/daily-updates.png" width="484" height="381" alt="Daily updates" class="hero-image">
          </div>
        </td>
      </tr>
    </table>

    <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
  </center>
</body>
</html>
