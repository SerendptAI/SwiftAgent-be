<!doctype html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="format-detection"
      content="telephone=no,address=no,email=no,date=no,url=no"
    />
    <title>Ticket confirmation</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:AllowPNG />
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>

      :root {
        color-scheme: only light;
        supported-color-schemes: light;
      }

      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        height: 100% !important;
      }
      table {
        border-collapse: collapse !important;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      body {
        background-color: #f5f5f4;
        color: #111111;
        font-family: Tahoma, Geneva, sans-serif;
        overflow-x: hidden;
      }

      .email-container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #f5f5f4;
      }

      .heading-svg {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      .logo-mark {
        display: block;
        width: 72px;
        height: 70px;
        margin: 0 auto;
      }

      .body-text {
        margin: 0;
        color: #111111;
        font-family: Tahoma, Geneva, sans-serif;
        font-size: 18px;
        line-height: 2;
        font-weight: 400;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
      }

      .button-shell {
        width: 100%;
        max-width: 422px;
        height: 58px;
        background-color: #f3b832;
        border-radius: 10px;
      }

      .ticket-label-cell {
        padding-right: 30px;
      }

      .ticket-number-cell {
        padding-right: 25px;
      }

      .ticket-label,
      .ticket-number {
        display: block;
        margin: 0;
        padding: 0;
        color: #ffffff !important;
        font-family: Tahoma, Geneva, sans-serif;
        font-size: 18px;
        line-height: 1;
        font-weight: 400;
        letter-spacing: 4px;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .ticket-label {
        text-align: left;
      }

      .ticket-number {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        height: 38px;
        padding: 0 14px;
        background-color: #d6a333;
        border-radius: 13px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-align: center;
        text-transform: uppercase;
      }

      .copy-break {
        display: inline;
      }

      .hero-frame {
        width: 100%;
      }

      .hero-image {
        display: block;
        width: 100%;
        height: auto;
      }

      @media only screen and (max-width: 620px) {
        .email-container {
          width: 100% !important;
          max-width: 100% !important;
        }
        .logo-cell {
          padding-top: 82px !important;
          padding-bottom: 48px !important;
        }
        .heading-cell {
          padding: 0 58px 64px !important;
        }
        .copy-cell {
          padding: 0 58px 80px !important;
        }
        .actions-cell {
          padding: 0 58px 52px !important;
        }
        .ticket-label-cell {
          padding-right: 30px !important;
        }
        .ticket-number-cell {
          padding-right: 25px !important;
        }
        .image-cell {
          padding: 0 58px 94px !important;
        }
      }

      @media only screen and (max-width: 480px) {
        .logo-cell {
          padding-top: 52px !important;
          padding-bottom: 42px !important;
        }
        .logo-mark {
          width: 50px !important;
          height: 49px !important;
        }
        .heading-cell {
          padding: 0 22px 40px !important;
        }
        .copy-cell {
          padding: 0 28px 48px !important;
        }
        .body-text {
          font-size: 16px !important;
          line-height: 1.9 !important;
        }
        .actions-cell {
          padding: 0 20px 38px !important;
        }
        .ticket-label-cell {
          padding-right: 14px !important;
        }
        .ticket-number-cell {
          padding-right: 10px !important;
        }
        .ticket-label {
          font-size: 15px !important;
          letter-spacing: 1.6px !important;
        }
        .ticket-number {
          font-size: 14px !important;
          letter-spacing: 0.08em !important;
          height: 38px !important;
          padding: 0 10px !important;
          border-radius: 13px !important;
          line-height: 1.2 !important;
        }
        .image-cell {
          padding: 0 34px 94px !important;
        }
      }

      @media only screen and (max-width: 430px) {
        .copy-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
          padding-bottom: 42px !important;
        }
        .body-text {
          font-size: 14px !important;
          line-height: 1.85 !important;
        }
        .copy-break {
          display: none !important;
        }
        .actions-cell {
          padding-left: 16px !important;
          padding-right: 16px !important;
          padding-bottom: 32px !important;
        }
        .ticket-label-cell {
          padding-right: 8px !important;
        }
        .ticket-number-cell {
          padding-right: 10px !important;
        }
      }

      @media only screen and (max-width: 375px) {
        .heading-cell {
          padding-left: 14px !important;
          padding-right: 14px !important;
          padding-bottom: 34px !important;
        }
        .copy-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
          padding-bottom: 40px !important;
        }
        .actions-cell {
          padding-left: 14px !important;
          padding-right: 14px !important;
          padding-bottom: 28px !important;
        }
        .ticket-label-cell {
          padding-right: 10px !important;
        }
        .ticket-number-cell {
          padding-right: 6px !important;
        }
        .ticket-label {
          font-size: 14px !important;
          letter-spacing: 1.2px !important;
        }
        .ticket-number {
          font-size: 14px !important;
          padding: 0 8px !important;
          letter-spacing: 0.08em !important;
        }
        .image-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
          padding-bottom: 94px !important;
        }
      }
    
            /* ── Force light mode ── */
            /* Prevent dark-mode inversion in Apple Mail, iOS Mail, Samsung Mail */
            @media (prefers-color-scheme: dark) {
                body,
                center,
                .email-container {
                    background-color: #f5f5f4 !important;
                    color: #111111 !important;
                }
                body * {
                    border-color: transparent !important;
                }
                /* Keep image colours untouched */
                img {
                    filter: none !important;
                }
                /* Preserve white-background cards / pills */
                .coupon-card {
                    background-color: #ffffff !important;
                }
                .preview-pill,
                .description-box {
                    background-color: #ededed !important;
                    color: #111111 !important;
                }
                /* Preserve button colours */
                .invite-button,
                .resolve-button,
                .cta-button,
                .copy-button,
                .choice-button,
                .yes-button,
                .no-button {
                    color: #ffffff !important;
                }
                .copy-button {
                    color: #111111 !important;
                }
                /* Preserve ticket pill */
                .button-shell {
                    background-color: #f3b832 !important;
                }
                .ticket-label,
                .ticket-number {
                    color: #ffffff !important;
                }
                /* Daily updates button */
                .date-button,
                .view-button {
                    color: #ffffff !important;
                }
            }
            /* Outlook dark mode (data-ogsc) */
            [data-ogsc] body,
            [data-ogsc] center,
            [data-ogsc] .email-container {
                background-color: #f5f5f4 !important;
                color: #111111 !important;
            }
            [data-ogsc] .coupon-card {
                background-color: #ffffff !important;
            }
            [data-ogsc] .preview-pill,
            [data-ogsc] .description-box {
                background-color: #ededed !important;
                color: #111111 !important;
            }
        </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f5f4; color-scheme: only light;">
    <div style="display: none; max-height: 0; overflow: hidden">
      Your complaint has been received. &#847; &#847; &#847; &#847; &#847;
      &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847; &#847;
    </div>

    <center
      role="article"
      aria-roledescription="email"
      lang="en"
      style="width: 100%; overflow-x: hidden; background-color: #f5f5f4"
    >
      <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:600px;">
    <tr>
    <td>
    <![endif]-->

      <table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        align="center"
        width="100%"
        style="max-width: 600px; margin: 0 auto"
        class="email-container"
      >
        <tr>
          <td
            class="logo-cell"
            style="padding: 82px 0 48px; text-align: center"
          >
            <img
              src="{{company_logo_url}}"
              width="72"
              height="70"
              alt="{{company_name}}"
              class="logo-mark"
            />
          </td>
        </tr>

        <tr>
          <td
            class="heading-cell"
            style="padding: 0 58px 64px; text-align: center"
          >
            <img
              class="heading-svg"
              src="{{base_url}}/images/headings/ticket_confirmation_heading.png"
              width="435"
              height="107"
              alt="Your complaint has been received" style="max-width: 100%; width: 100%; height: auto;">
          </td>
        </tr>

        <tr>
          <td class="copy-cell" style="padding: 0 58px 80px; text-align: center">
            <p class="body-text" style="margin: 0; color: #111111; font-family: Tahoma, Geneva, sans-serif; font-size: 18px; line-height: 2; font-weight: 400; text-align: center; text-transform: uppercase;">
              You can expect to receive follow-up<br class="copy-break" />
              emails from the team at {{company_name}}.<br class="copy-break" />
              They will keep you updated on<br class="copy-break" />
              any developments and ensure that you<br class="copy-break" />
              have all the information you need.
            </p>
          </td>
        </tr>

        <tr>
          <td class="actions-cell" style="padding: 0 58px 52px">
            <table
              role="presentation"
              cellspacing="0"
              cellpadding="0"
              border="0"
              width="100%"
              style="max-width: 422px; margin: 0 auto"
              height="58"
              class="button-shell"
            >
              <tr>
                <td
                  width="50%"
                  align="left"
                  class="ticket-label-cell"
                  style="
                    padding: 10px 30px 10px 25px;
                    text-align: left;
                    vertical-align: middle;
                  "
                >
                  <span class="ticket-label">Ticket number:</span>
                </td>
                <td
                  width="50%"
                  align="center"
                  class="ticket-number-cell"
                  style="
                    padding: 10px 25px 10px 0;
                    text-align: center;
                    vertical-align: middle;
                  "
                >
                  <span class="ticket-number" style="display: inline-block; font-size: 16px; height: 38px; line-height: 38px; padding: 0 14px; background-color: #d6a333; border-radius: 13px; color: #ffffff; font-family: Tahoma, Geneva, sans-serif; font-weight: 500; letter-spacing: 0.1em; text-align: center; text-transform: uppercase; white-space: nowrap; vertical-align: middle;">{{ticket_number}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="image-cell" style="padding: 0 58px 94px">
          <div class="hero-frame">
            <img
              src="{{base_url}}/images/ticket-confirmation.png"
              width="484"
              height="381"
              alt="Ticket confirmation"
              class="hero-image" style="max-width: 100%; width: 100%; height: auto;">
          </div>
        </td>
      </tr>
      </table>

      <!--[if mso | IE]>
    </td>
    </tr>
    </table>
    <![endif]-->
    </center>
  </body>
</html>
